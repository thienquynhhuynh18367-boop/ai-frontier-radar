name: Daily Radar

on:
  schedule:
    # 北京时间每天 08:17；GitHub 定时触发可能延迟。
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      business_date:
        description: "可选：已结束的上海业务日 YYYY-MM-DD；留空为昨天。只做真实当前时刻的有限回补。"
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: radar-data-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      data_sha: ${{ steps.commit.outputs.data_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Offline quality gates
        run: |
          npm run test
          npm run lint
          npm run typecheck
      - name: Collect six public sources
        id: radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUSINESS_DATE: ${{ inputs.business_date || '' }}
        run: |
          if [[ -n "$BUSINESS_DATE" && ! "$BUSINESS_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "business_date must be YYYY-MM-DD" >&2
            exit 2
          fi
          # 先保存退出码；全部来源失败时仍可提交安全的 Health 状态。
          if [[ -n "$BUSINESS_DATE" ]]; then
            if npm run radar:run -- --date "$BUSINESS_DATE"; then code=0; else code=$?; fi
          else
            if npm run radar:run; then code=0; else code=$?; fi
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit validated data changes
        id: commit
        run: |
          npm run verify:data-budget
          git add -A -- data public/data
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh radar snapshots"
            # 快进推送；并发源码提交导致冲突时安全失败，不强推。
            git push origin HEAD:main
          fi
          echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fail run if no valid new batch
        if: steps.radar.outputs.exit_code != '0'
        run: |
          echo "Collection failed; previous latest and deployed site remain valid." >&2
          exit 1

  build:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.collect.outputs.data_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and verify latest static site
        env:
          RADAR_BASE_PATH: /ai-frontier-radar
        run: |
          npm run build
          npm run verify:export
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/

  deploy:
    needs: [collect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check artifact still matches main
        id: current
        env:
          EXPECTED_SHA: ${{ needs.collect.outputs.data_sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" == "$EXPECTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skip stale deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy GitHub Pages artifact
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
